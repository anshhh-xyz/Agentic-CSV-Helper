<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Data Analyst</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app">

  <aside class="side">
    <div class="brand">Data Analyst</div>

    <div class="banner" id="banner" role="alert" hidden></div>

    <section class="block">
      <button type="button" class="btn btn-block" id="upload-btn">Upload CSV</button>
      <input type="file" id="file-input" accept=".csv" hidden />
      <div class="dataset">
        <div class="dataset-name" id="dataset-name"></div>
        <div class="dataset-meta" id="dataset-meta"></div>
      </div>
    </section>

    <section class="block block-columns">
      <h2>Columns</h2>
      <ul class="columns" id="columns"></ul>
    </section>

    <section class="block block-memory" id="memory-block" hidden>
      <h2>Memory</h2>
      <ul class="memory" id="memory"></ul>
    </section>
  </aside>

  <main class="main">
    <div class="thread" id="thread">
      <div class="stream" id="stream" aria-live="polite">
        <div class="empty" id="empty">
          <h1>Ask your data anything.</h1>
          <div class="examples">
            <button type="button" class="example">What does this dataset contain?</button>
            <button type="button" class="example">Is the data clean, or are values missing?</button>
            <button type="button" class="example">Show the strongest relationship and plot it.</button>
          </div>
        </div>
      </div>
    </div>

    <div class="composer-wrap">
      <form class="composer" id="composer" autocomplete="off">
        <input type="text" id="question" placeholder="Ask a question" aria-label="Question" />
        <button type="submit" class="btn" id="ask-btn">Ask</button>
      </form>
    </div>
  </main>

</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title">Same dataset?</h3>
    <p><strong id="modal-file"></strong> was analysed before. Is this an updated version of it, or a different dataset?</p>
    <p class="muted">The same dataset keeps what was remembered. A different one starts fresh.</p>
    <div class="modal-actions">
      <button type="button" class="btn" id="resolve-same">Same dataset</button>
      <button type="button" class="btn btn-ghost" id="resolve-new">Different dataset</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
